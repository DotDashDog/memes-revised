[project]
name = "memes-revised"
version = "0.0.0"
description = "Predicting internet meme spread dynamics from content embeddings."
requires-python = ">=3.12"
dependencies = [
    "corner>=2.2.3",
    "diffrax>=0.7.2",
    "easyocr>=1.7.2",
    "hdbscan>=0.8.43",
    "jax>=0.10.0",
    "matplotlib>=3.10.9",
    "numpyro>=0.21.0",
    "open-clip-torch>=3.3.0",
    "openai>=2.37.0",
    "opencv-python-headless>=4.13.0.92",
    "paddleocr>=3.5.0",
    "paddlepaddle>=3.3.1",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "pyarrow>=24.0.0",
    "pytesseract>=0.3.13",
    "requests>=2.34.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "sentence-transformers>=5.5.0",
    "torch>=2.12.0",
    "tqdm>=4.67.3",
    "transformers>=5.8.1",
    "umap-learn>=0.5.12",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
