[project]
name = "memes-revised"
version = "0.0.0"
description = "Predicting internet meme spread dynamics from content embeddings."
requires-python = ">=3.12"
dependencies = [
    "corner>=2.2.3",
    "diffrax>=0.7.2",
    "easyocr>=1.7.2",
    "hdbscan>=0.8.43",
    "jax>=0.10.0",
    "libtorrent>=2.0.13",
    "matplotlib>=3.10.9",
    "numpyro>=0.21.0",
    "open-clip-torch>=3.3.0",
    "openai>=2.37.0",
    "opencv-python-headless>=4.13.0.92",
    "paddleocr>=3.5.0",
    "paddlepaddle>=3.3.1",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "pyarrow>=24.0.0",
    "pytesseract>=0.3.13",
    "requests>=2.34.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "sentence-transformers>=5.5.0",
    "torch>=2.12.0",
    "tqdm>=4.67.3",
    "transformers>=5.8.1",
    "umap-learn>=0.5.12",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
# GPU-enabled JAX. Linux-gated: the CUDA wheels are Linux-only, so this
# resolves to nothing on macOS and the laptop keeps a CPU JAX.
# Native Windows has no JAX CUDA build at all -- run under WSL2.
# Sync with: uv sync --group gpu
gpu = [
    "jax[cuda12]>=0.10.0 ; sys_platform == 'linux'",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
